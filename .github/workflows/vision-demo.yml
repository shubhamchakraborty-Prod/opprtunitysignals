name: Build Leadership Vision Demo

on:
  push:
    branches:
      - feature/leadership-vision-demo-v1
      - feature/realistic-connected-platform-demo
  workflow_dispatch:

jobs:
  offline-vision:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify offline vision is self-contained and explicitly simulated
        run: |
          test -s dist/platform-demo.html
          grep -q 'window.__OPX_SHOWCASE__=true' dist/platform-demo.html
          grep -q 'showcase' dist/platform-demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-explorer-platform-demo
          path: dist/platform-demo.html
          if-no-files-found: error
          retention-days: 30
